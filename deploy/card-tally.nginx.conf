# Replace card-tally.example.com and install this as an Nginx site.
# Serve only dist/ files copied into /var/www/card-tally.
# Certbot can add HTTPS after DNS and port 80 are ready.
server {
    listen 80;
    listen [::]:80;
    server_name card-tally.example.com;
    root /var/www/card-tally;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;

    access_log /var/log/nginx/card-tally.access.log;
    error_log /var/log/nginx/card-tally.error.log;

    location /api/ {
        limit_req zone=card_ledger_api burst=40 nodelay;
        limit_req_status 429;
        # No trailing slash: retain /api/ in requests to the backend.
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_cache off;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        # Vue Router history fallback for /overview, /records, /cards.
        try_files $uri $uri/ /index.html;
    }
}
