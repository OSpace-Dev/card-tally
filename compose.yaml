services:
  api:
    build: .
    image: card-tally-api:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ledger-data:/data
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATA_DIR: /data
      SERVE_STATIC: "false"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  ledger-data:
    name: ${CARD_TALLY_DATA_VOLUME:-card-tally-data}
