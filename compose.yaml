services:
  api:
    build: .
    image: card-tally-api:local
    restart: unless-stopped
    init: true
    ports:
      # Nginx on this host can proxy to this port; see .env.example for LAN access.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3001"
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATA_DIR: /data
      SERVE_STATIC: "false"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
